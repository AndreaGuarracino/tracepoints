[package]
name = "tracepoints"
version = "0.1.0"
edition = "2021"
authors = ["Andrea Guarracino <aguarracino@tgen.org>"]
license = "MIT"
description = "Compressed alignment representation"
repository = "https://github.com/GuarracinoLab/tracepoints"
readme = "README.md"
keywords = ["bioinformatics", "alignment", "compression"]

[dependencies]
#lib_wfa2 = { path = "/home/guarracino/Dropbox/git/lib_wfa2"}
lib_wfa2 = { git = "https://github.com/AndreaGuarracino/lib_wfa2", rev = "787093a7880a26b1b9b25bdb038b899784e01c81" }

[dev-dependencies]
# Used by es2bit_bench to measure gzip-compressed byte sizes.
flate2 = "1"
# Used by es2bit_bench to encode the tracepoint streams exactly as TPA does.
tpa = { git = "https://github.com/AndreaGuarracino/tpa", rev = "f96bbd5aa0e5c763ac102cb7962a993ce63f01a5" }
